name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint-and-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Byte-compile all sources
        run: |
          python -m compileall -q CommonFuncs Features runner.py

      - name: Lint (flake8 — non-blocking style warnings)
        run: |
          flake8 CommonFuncs Features runner.py \
            --count --max-line-length=120 \
            --extend-ignore=E501,W503,E402,E722,F401,F403,F405 \
            --show-source --statistics
